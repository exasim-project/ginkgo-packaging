name: check

# Fast checks on every push and pull request (lint plus rendering the recipe
# for every version, backend and platform), and a real CPU build of the conda
# package and Docker image when a pull request touches them.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color
      - name: shellcheck
        run: shellcheck scripts/*.sh docker/*.sh conda/recipe/build.sh
      - name: hadolint
        run: docker run --rm -i hadolint/hadolint hadolint --ignore DL3008 --ignore DL3006 - < docker/Dockerfile

  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.11.0
      - run: pixi run render

  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      conda: ${{ steps.filter.outputs.conda }}
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: filter
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          changed=$(git diff --name-only "${BASE}" HEAD)
          grep -qE '^(conda/|\.github/workflows/conda\.yml)' <<< "${changed}" \
            && echo "conda=true" >> "${GITHUB_OUTPUT}" || true
          grep -qE '^(docker/|conda/recipe/smoke/|\.github/workflows/docker\.yml)' <<< "${changed}" \
            && echo "docker=true" >> "${GITHUB_OUTPUT}" || true

  conda-cpu:
    needs: [changes, render]
    if: needs.changes.outputs.conda == 'true'
    uses: ./.github/workflows/conda.yml
    with:
      ref: v1.11.0
      version: 1.11.0
      backends: cpu

  docker-cpu:
    needs: [changes, lint]
    if: needs.changes.outputs.docker == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker.yml
    with:
      ref: v1.11.0
      version: 1.11.0
      tags: pr-${{ github.event.pull_request.number }}
      backends: cpu
