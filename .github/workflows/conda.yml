name: conda

# Builds the Ginkgo conda packages for one Ginkgo ref and optionally uploads
# them to a prefix.dev channel. Called by release.yml and nightly.yml, and can be run
# by hand to (re)build a single version.
on:
  workflow_call:
    inputs:
      ref:
        description: Ginkgo git tag, branch or commit
        type: string
        required: true
      version:
        description: conda package version
        type: string
        required: true
      build_number:
        type: string
        default: "0"
      backends:
        description: Comma separated list of cpu, cuda, sycl, rocm
        type: string
        default: cpu,cuda,sycl
      channel:
        description: prefix.dev channel to upload to
        type: string
        default: ""
      overwrite:
        description: Replace packages that already exist in the channel
        type: boolean
        default: false
      upload:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      ref:
        description: Ginkgo git tag, branch or commit (e.g. v1.11.0, develop)
        required: true
        default: v1.11.0
      version:
        description: conda package version (e.g. 1.11.0)
        required: true
        default: 1.11.0
      build_number:
        description: Bump when rebuilding an already published version
        default: "0"
      backends:
        description: Comma separated list of cpu, cuda, sycl, rocm (rocm is experimental)
        default: cpu,cuda,sycl
      channel:
        description: prefix.dev channel to upload to
        default: ""
      overwrite:
        description: Replace packages that already exist in the channel
        type: boolean
        default: false
      upload:
        description: Upload the built packages to prefix.dev
        type: boolean
        default: false

permissions:
  contents: read

env:
  RATTLER_BUILD_VERSION: v0.76.1
  ROCM_VERSION: 6.4.4

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.matrix.outputs.include }}
    steps:
      - id: matrix
        env:
          BACKENDS: ${{ inputs.backends }}
        run: |
          set -euo pipefail
          all='[
            {"backend": "cpu",  "platform": "linux-64",  "os": "ubuntu-latest"},
            {"backend": "cpu",  "platform": "osx-arm64", "os": "macos-latest"},
            {"backend": "cpu",  "platform": "osx-64",    "os": "macos-26-intel"},
            {"backend": "cpu",  "platform": "win-64",    "os": "windows-2022"},
            {"backend": "cuda", "platform": "linux-64",  "os": "ubuntu-latest"},
            {"backend": "sycl", "platform": "linux-64",  "os": "ubuntu-latest"},
            {"backend": "rocm", "platform": "linux-64",  "os": "ubuntu-24.04"}
          ]'
          wanted=$(jq -cn --arg b "${BACKENDS}" '$b | gsub(" "; "") | split(",")')
          include=$(jq -c --argjson wanted "${wanted}" \
            '[.[] | select(.backend as $b | $wanted | index($b))]' <<< "${all}")
          if [ "$(jq length <<< "${include}")" -eq 0 ]; then
            echo "::error::no known backend in '${BACKENDS}'"
            exit 1
          fi
          echo "include=${include}" >> "${GITHUB_OUTPUT}"

  build:
    name: ${{ matrix.platform }}/${{ matrix.backend }}
    needs: matrix
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    # The ROCm package depends on a system ROCm and is experimental.
    continue-on-error: ${{ matrix.backend == 'rocm' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.include) }}
    env:
      GINKGO_VERSION: ${{ inputs.version }}
      GINKGO_REF: ${{ inputs.ref }}
      GINKGO_BUILD_NUMBER: ${{ inputs.build_number }}
      # Lets the test environment of the CUDA package solve on a runner
      # without a GPU (the package requires __cuda).
      CONDA_OVERRIDE_CUDA: "12.9"
    steps:
      - uses: actions/checkout@v7

      # The GPU toolchains plus the object files of a full build do not fit
      # next to the preinstalled toolchains on a hosted runner.
      - name: Free disk space
        if: runner.os == 'Linux' && matrix.backend != 'cpu'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install ROCm
        if: matrix.backend == 'rocm'
        run: scripts/install-rocm.sh "${ROCM_VERSION}"

      - name: Build the package
        uses: prefix-dev/rattler-build-action@v0.2.39
        with:
          rattler-build-version: ${{ env.RATTLER_BUILD_VERSION }}
          recipe-path: conda/recipe/recipe.yaml
          artifact-name: conda-${{ inputs.version }}-${{ matrix.platform }}-${{ matrix.backend }}
          build-args: >-
            --variant-config conda/variants/base.yaml
            --variant-config conda/variants/${{ matrix.backend }}.yaml
            --target-platform ${{ matrix.platform }}
            --channel conda-forge

  publish:
    name: publish to prefix.dev
    needs: build
    if: inputs.upload
    runs-on: ubuntu-latest
    # Holds the optional PREFIX_API_KEY secret, see README.md.
    environment: prefix
    permissions:
      contents: read
      # Trusted publishing to prefix.dev when no API key is configured.
      id-token: write
    steps:
      - name: Collect the built packages
        uses: actions/download-artifact@v8
        with:
          pattern: conda-${{ inputs.version }}-*
          merge-multiple: true
          path: packages

      - name: Install rattler-build
        uses: prefix-dev/rattler-build-action@v0.2.39
        with:
          rattler-build-version: ${{ env.RATTLER_BUILD_VERSION }}
          setup-only: true

      - name: Upload to prefix.dev
        env:
          PREFIX_CHANNEL: ${{ inputs.channel }}
          PREFIX_API_KEY: ${{ secrets.PREFIX_API_KEY }}
          OVERWRITE: ${{ inputs.overwrite }}
        run: |
          set -euo pipefail
          if [ -z "${PREFIX_CHANNEL}" ]; then
            echo "::error::No prefix.dev channel given, set the PREFIX_CHANNEL repository variable"
            exit 1
          fi
          if [ -z "${PREFIX_API_KEY}" ]; then
            unset PREFIX_API_KEY
            echo "No PREFIX_API_KEY secret, using trusted publishing"
          fi
          mapfile -t files < <(find packages -type f \( -name '*.conda' -o -name '*.tar.bz2' \) | sort)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::No packages were built"
            exit 1
          fi
          printf 'uploading %s\n' "${files[@]}"
          # Nightlies may be rebuilt on the same day and replace the existing
          # files; released packages are never overwritten.
          if [ "${OVERWRITE}" = "true" ]; then
            mode=--force
          else
            mode=--skip-existing
          fi
          rattler-build upload prefix "${mode}" "${files[@]}"
