name: pixi

# Installs published Ginkgo packages into the pixi example workspace
# (pixi/example) and runs the smoke test, i.e. checks the packages the way a
# user consumes them. Called after uploads by release.yml and nightly.yml.
on:
  workflow_call:
    inputs:
      version:
        description: Ginkgo package version to test
        type: string
        required: true
      channel:
        description: prefix.dev channel the packages were uploaded to
        type: string
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: Ginkgo package version to test
        required: true
        default: 1.11.0
      channel:
        description: prefix.dev channel the packages were uploaded to
        required: true

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.env }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, env: cpu}
          - {os: ubuntu-latest, env: mpi}
          - {os: ubuntu-latest, env: cuda}
          - {os: ubuntu-latest, env: sycl}
          - {os: macos-latest, env: cpu}
          - {os: macos-latest, env: mpi}
          - {os: windows-2022, env: cpu}
    defaults:
      run:
        working-directory: pixi/example
    env:
      # No GPU on the runner; the smoke test only uses the reference executor.
      CONDA_OVERRIDE_CUDA: "12.9"
    steps:
      - uses: actions/checkout@v7

      - uses: prefix-dev/setup-pixi@v0.11.0
        with:
          run-install: false

      - name: Point the workspace at the tested channel and version
        shell: bash
        env:
          CHANNEL: ${{ inputs.channel }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          channel="https://prefix.dev/${CHANNEL}"
          # Replace the default channel and pin the version under test.
          sed -i.bak \
            -e "s|\"https://prefix.dev/[^\"]*\"|\"${channel}\"|" \
            -e "s|ginkgo = { version = \"\*\"|ginkgo = { version = \"==${VERSION}\"|" \
            pixi.toml
          rm pixi.toml.bak
          grep -nE "channels|ginkgo =" pixi.toml

      # Uploads take a while to show up in the channel index, and pixi solves
      # every platform of an environment, so wait until all of them see it.
      - name: Wait for the packages to be indexed
        shell: bash
        env:
          CHANNEL: ${{ inputs.channel }}
          VERSION: ${{ inputs.version }}
        run: |
          set -uo pipefail
          for attempt in $(seq 1 45); do
            missing=""
            for platform in linux-64 osx-arm64 osx-64 win-64; do
              pixi search "ginkgo==${VERSION}" --channel "https://prefix.dev/${CHANNEL}" \
                --platform "${platform}" > /dev/null 2>&1 || missing+=" ${platform}"
            done
            if [ -z "${missing}" ]; then
              echo "ginkgo ${VERSION} is indexed on all platforms"
              exit 0
            fi
            echo "attempt ${attempt}: not yet indexed on${missing}"
            sleep 60
          done
          echo "::error::ginkgo ${VERSION} did not show up in ${CHANNEL} within 45 minutes"
          exit 1

      - name: Run the smoke test
        run: pixi run --environment ${{ matrix.env }} smoke

      - name: Show the installed Ginkgo build
        if: always()
        run: pixi list --environment ${{ matrix.env }} ginkgo
