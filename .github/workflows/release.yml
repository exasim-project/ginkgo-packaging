name: release

# Builds and publishes released Ginkgo versions: conda packages to the "main"
# label on anaconda.org and Docker images tagged with the version. The highest
# version in the list also gets the Docker "latest" tag.
#
# Only what is not published yet gets built: for every version and backend the
# plan job looks for the conda packages (same version and build number, all
# platforms) on anaconda.org and for the image tag on ghcr.io, see
# scripts/release-plan.sh. Bump build_number or set force to rebuild.
#
# Run it by hand to (re)build any set of releases, e.g. the backfill of
# 1.10.0 and 1.11.0, or trigger it from the Ginkgo repository on release with
#   gh api repos/<owner>/ginkgo-packaging/dispatches \
#     -f event_type=ginkgo-release -F client_payload[version]=1.12.0
on:
  workflow_dispatch:
    inputs:
      versions:
        description: Space separated Ginkgo versions to build (tags are v<version>)
        required: true
        default: 1.10.0 1.11.0
      build_number:
        description: conda build number, bump when rebuilding a published version
        default: "0"
      conda_backends:
        description: conda backends (cpu, cuda, sycl, rocm)
        default: cpu,cuda,sycl
      docker_backends:
        description: Docker backends (cpu, cuda, rocm, sycl)
        default: cpu,cuda,rocm,sycl
      upload:
        description: Upload the conda packages and push the Docker images
        type: boolean
        default: true
      force:
        description: Rebuild even if the packages/images are already published
        type: boolean
        default: false
  repository_dispatch:
    types: [ginkgo-release]

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      latest: ${{ steps.plan.outputs.latest }}
      conda: ${{ steps.plan.outputs.conda }}
      docker: ${{ steps.plan.outputs.docker }}
      upload: ${{ steps.upload.outputs.upload }}
    steps:
      - uses: actions/checkout@v7

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Find what is not published yet
        id: plan
        env:
          VERSIONS: ${{ inputs.versions || github.event.client_payload.version }}
          BUILD_NUMBER: ${{ inputs.build_number || '0' }}
          CONDA_BACKENDS: ${{ inputs.conda_backends || 'cpu,cuda,sycl' }}
          DOCKER_BACKENDS: ${{ inputs.docker_backends || 'cpu,cuda,rocm,sycl' }}
          ANACONDA_OWNER: ${{ vars.ANACONDA_OWNER || 'ginkgo-project' }}
          IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/ginkgo
          FORCE: ${{ inputs.force || false }}
        run: |
          IMAGE_PREFIX="${IMAGE_PREFIX,,}" scripts/release-plan.sh
          cat "${GITHUB_OUTPUT}"

      - id: upload
        run: echo "upload=${{ github.event_name == 'repository_dispatch' || inputs.upload }}" >> "${GITHUB_OUTPUT}"

  conda:
    name: conda ${{ matrix.version }}
    needs: plan
    if: needs.plan.outputs.conda != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.conda) }}
    uses: ./.github/workflows/conda.yml
    with:
      ref: v${{ matrix.version }}
      version: ${{ matrix.version }}
      build_number: ${{ inputs.build_number || '0' }}
      backends: ${{ matrix.backends }}
      # Release candidates never land on the default label.
      label: ${{ contains(matrix.version, 'rc') && 'dev' || 'main' }}
      upload: ${{ needs.plan.outputs.upload == 'true' }}
    secrets: inherit

  docker:
    name: docker ${{ matrix.version }}
    needs: plan
    if: needs.plan.outputs.docker != '[]'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.docker) }}
    uses: ./.github/workflows/docker.yml
    with:
      ref: v${{ matrix.version }}
      version: ${{ matrix.version }}
      tags: ${{ matrix.version }}${{ matrix.version == needs.plan.outputs.latest && ' latest' || '' }}
      backends: ${{ matrix.backends }}
      push: ${{ needs.plan.outputs.upload == 'true' }}

  pixi:
    name: pixi ${{ matrix.version }}
    needs: [plan, conda]
    if: needs.plan.outputs.upload == 'true' && needs.plan.outputs.conda != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.conda) }}
    uses: ./.github/workflows/pixi.yml
    with:
      version: ${{ matrix.version }}
      label: ${{ contains(matrix.version, 'rc') && 'dev' || 'main' }}
