# Toolchain pins shared by every backend. A backend file (cpu.yaml, cuda.yaml,
# ...) is always passed after this one and may override keys.
c_compiler:
  - if: linux
    then: gcc
  - if: osx
    then: clang
  # vs2022 needs Visual Studio 2022 on the runner, see conda.yml.
  - if: win
    then: vs2022
cxx_compiler:
  - if: linux
    then: gxx
  - if: osx
    then: clangxx
  - if: win
    then: vs2022
c_compiler_version:
  - if: linux
    then: "14"
  - if: osx
    then: "19"
cxx_compiler_version:
  - if: linux
    then: "14"
  - if: osx
    then: "19"
c_stdlib:
  - if: linux
    then: sysroot
  - if: osx
    then: macosx_deployment_target
  - if: win
    then: vs
c_stdlib_version:
  - if: linux
    then: "2.28"
  # Ginkgo needs C++17 library support, which starts with macOS 10.15.
  - if: osx
    then: "11.0"
  - if: win
    then: "2022"

openmpi:
  - "5"

ginkgo_backend:
  - cpu
mpi:
  - nompi
