# Reference + OpenMP + CUDA kernels. CUDA 12.9 is the newest toolkit that all
# of Ginkgo 1.10, 1.11 and develop build with (1.10 does not know CUDA 13).
ginkgo_backend:
  - cuda
mpi:
  - nompi
  - openmpi
cuda_compiler:
  - cuda-nvcc
cuda_compiler_version:
  - "12.9"
# SASS for Volta, Ampere and Hopper (binary compatible within a major
# version), plus PTX so newer GPUs can JIT-compile.
cuda_architectures:
  - "70-real;80-real;90-real;90-virtual"
