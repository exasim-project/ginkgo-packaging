# EXPERIMENTAL. Reference + OpenMP + HIP kernels for AMD GPUs. conda-forge has
# no hipBLAS/hipSPARSE/hipRAND/rocThrust, so this builds against a system ROCm
# in /opt/rocm (the rocm/dev-ubuntu-24.04 image in CI) and the resulting
# package needs the same ROCm installed at runtime. Prefer the Docker image.
ginkgo_backend:
  - rocm
mpi:
  - nompi
# CDNA GPUs only: Ginkgo's HIP kernels assume 64-wide wavefronts and do not
# compile for wave32 RDNA targets such as gfx1030/gfx1100.
hip_architectures:
  - "gfx908;gfx90a;gfx942"
