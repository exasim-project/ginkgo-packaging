# Reference + OpenMP + SYCL kernels built with Intel's oneAPI DPC++ compiler
# from conda-forge. mkl-devel-dpcpp is on conda-forge from 2025.2 onwards.
ginkgo_backend:
  - sycl
# MPICH ABI, which Intel MPI implements. The MPI build is GPU-aware.
mpi:
  - nompi
  - mpich
dpcpp_compiler:
  - dpcpp
dpcpp_compiler_version:
  - "2025.2"
mkl_version:
  - "2025.2"
# The oneDPL release that ships with oneAPI 2025.2.
onedpl_version:
  - "2022.9"
